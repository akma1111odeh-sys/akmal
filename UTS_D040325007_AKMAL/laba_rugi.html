<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Laba Rugi - PT Prima Akuntindo</title>
    <!-- External CSS Wajib -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="report-page-wrapper">
        <div class="report-container">
            <a href="dashboard.html" class="nav-back">&larr; Kembali ke Dashboard</a>
            
            <!-- Judul & Kop Laporan Laba Rugi -->
            <header class="report-header">
                <h2>PT PRIMA AKUNTINDO</h2>
                <h3>LAPORAN LABA RUGI</h3>
                <p>Per 31 Oktober 2026</p>
            </header>

            <!-- Tabel Laporan Laba Rugi 100% lebar kontainer dengan border-collapse -->
            <table class="report-table">
                <thead>
                    <tr>
                        <th class="col-kode">Kode</th>
                        <th class="col-keterangan">Keterangan Akun</th>
                        <th class="col-nominal text-right">Nominal (Rp)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="col-kode">4101</td>
                        <td>Pendapatan Jasa</td>
                        <td class="text-right">120.000.000</td>
                    </tr>
                    <tr>
                        <td class="col-kode">5101</td>
                        <td>Beban Gaji Karyawan</td>
                        <td class="text-right">30.000.000</td>
                    </tr>
                    <tr>
                        <td class="col-kode">5102</td>
                        <td>Beban Sewa Gedung</td>
                        <td class="text-right">10.000.000</td>
                    </tr>
                    <tr>
                        <td class="col-kode">5103</td>
                        <td>Beban Perlengkapan</td>
                        <td class="text-right">2.500.000</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <!-- Colspan 2 untuk Total Laba Bersih dicetak tebal -->
                        <td colspan="2" class="text-right">TOTAL LABA BERSIH</td>
                        <!-- Kolom nominal diletakkan rata kanan dan dicetak tebal -->
                        <td class="text-right">77.500.000</td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

</body>
</html>
