<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PT Prima Akuntindo</title>
    <!-- External CSS Wajib -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

    <!-- Card Form Login yang berada di tengah layar secara vertikal dan horizontal -->
    <div class="login-card">
        <header class="login-header">
            <h2>PT PRIMA AKUNTINDO</h2>
            <p>Login SIA Terpadu</p>
        </header>

        <form class="login-form" action="dashboard.html" method="get">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Masukkan username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-login">MASUK SISTEM</button>
        </form>
    </div>

</body>
</html>
