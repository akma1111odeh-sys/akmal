<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>02 - Form Login - Sebelum</title>
    <style>
        /* CSS Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Styles */
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
        }

        /* Login Container Styles */
        .login-container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Label Styles */
        .login-container label {
            display: block;
            margin-bottom: 5px;
        }

        /* Input Styles */
        .login-container input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        /* Focus State */
        .login-container input:focus {
            border-color: #007bff;
            outline: none;
        }

        /* Submit Button Styles */
        .login-container button {
            width: 100%;
            background-color: #007bff;
            color: white;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            border: none;
        }

        /* Hover Effect */
        .login-container button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <!-- 
    INSTRUKSI PENGERJAAN (TO-DO LIST):
    1. Atur body agar form berada di tengah layar (Flexbox, min-height 100vh).
    2. Berikan gaya pada kontainer ".login-container" (background putih, padding 30px, border-radius 8px, box-shadow).
    3. Atur label agar display-nya 'block' dan memiliki margin-bottom agar input ada di bawahnya.
    4. Atur input text dan password agar lebarnya 100% (width: 100%), padding 10px, margin-bottom 15px, border 1px solid #ccc, dan border-radius 5px.
    5. Tambahkan pseudo-class :focus pada input (ubah warna border menjadi biru dan outline: none saat diklik).
    6. Atur tombol submit (lebar 100%, background warna, warna teks putih, padding, border-radius, cursor: pointer, border: none).
    7. Tambahkan efek hover pada tombol submit.
    -->
    <div class="login-container">
        <h2>Masuk ke Akun</h2>
        <form>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Masukkan email">
            
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Masukkan password">
            
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
